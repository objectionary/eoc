---
# yamllint disable rule:line-length
name: itest
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: itest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  itest:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        java: [19]
        node: [18]
        # lang: [Java, JavaScript]
        lang: [Java]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      - run: npm install
      - shell: bash
        run: |
          cd itest
          declare -a opts=(
            "../src/eoc.js"
            "--batch"
            "--language=${{ matrix.lang }}"
            "--easy"
            "--blind"
          )
          node "${opts[@]}" link
          # Dataizing "program" would print through "stdout", which terminates
          # in eo-runtime 0.62.0, see objectionary/eo#6169; until that is
          # released, we dataize "story" instead, which prints nothing.
          node "${opts[@]}" --alone dataize story
          node "${opts[@]}" clean
          node "${opts[@]}" test
