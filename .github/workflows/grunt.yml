---
# yamllint disable rule:line-length
name: grunt
"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: grunt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
        java: [22]
        node: [18]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: ${{ matrix.java }}
      - name: Install phino (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          curl -fsSL -o phino http://phino.objectionary.com/releases/ubuntu-22.04/phino-latest
          chmod +x phino
          sudo mv phino /usr/local/bin/phino
      - name: Install phino (macOS)
        if: matrix.os == 'macos-15'
        run: |
          curl -fsSL -o phino http://phino.objectionary.com/releases/macos-15/phino-latest
          chmod +x phino
          sudo mv phino /usr/local/bin/phino
      - name: Install phino (Windows)
        if: matrix.os == 'windows-2022'
        run: |
          Invoke-WebRequest -Uri http://phino.objectionary.com/releases/windows-2022/phino-latest.exe -OutFile phino.exe
          Move-Item phino.exe C:\Windows\System32\phino.exe
        shell: powershell
      - run: npm install
      - run: npx grunt
  telegram:
    needs: build
    runs-on: ubuntu-24.04
    if: ${{ failure() && github.ref == 'refs/heads/master' }}
    steps:
      - uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "⚠️ Grunt build of ${{ github.repository }} [failed](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          disable_web_page_preview: true
          format: markdown
  recovered:
    needs: build
    runs-on: ubuntu-24.04
    if: ${{ success() && github.ref == 'refs/heads/master' }}
    permissions:
      actions: read
    steps:
      - id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          latest() {
            gh api "/repos/${{ github.repository }}/actions/workflows/grunt.yml/runs?branch=${{ github.ref_name }}&status=$1&per_page=1" \
              --jq '[ .workflow_runs[] | select(.id != ${{ github.run_id }}) | .id ][0] // 0'
          }
          if [ "$(latest failure)" -gt "$(latest success)" ]; then
            echo 'broken=yes' >> "${GITHUB_OUTPUT}"
          fi
      - if: ${{ steps.previous.outputs.broken == 'yes' }}
        uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "👍🏻 Grunt build of ${{ github.repository }} [recovered](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          disable_web_page_preview: true
          format: markdown
